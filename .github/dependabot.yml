version: 2
# Alleen npm-pakketten. De GitHub Actions in .github/workflows/ staan er bewust niet in: die
# workflows zijn van de template, en nieuwe Actions-versies komen met een nieuwe templateversie.
# Een beveiligingsupdate van Dependabot voor een Action (App inrichten zet die aan) laat
# guard:template wel door, zolang hij alleen `uses:`-regels wijzigt.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Eén PR voor alle kleine updates: minder ruis, één keer checks draaien.
      kleine-updates:
        update-types: [minor, patch]
