version: 2
# Alleen npm-pakketten. De GitHub Actions in .github/workflows/ staan er bewust niet in: die
# workflows zijn van de template, dus een voorstel van Dependabot zou de verplichte check
# "Code" (guard:template) rood maken. Nieuwe Actions-versies komen met een nieuwe templateversie.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Eén PR voor alle kleine updates: minder ruis, één keer checks draaien.
      kleine-updates:
        update-types: [minor, patch]
