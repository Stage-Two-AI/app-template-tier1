name: Kwaliteitspoort

on:
  pull_request:
    # Bewust zonder `edited`: een aangepaste PR-tekst (previewlink plakken, een vinkje
    # zetten) startte de hele poort opnieuw en brak de lopende run af. Bij Richplant was
    # dat in oktober 2026 meer dan de helft van de Actions-minuten. Drie guards lezen een
    # bevestigingsregel uit de PR-tekst; die halen de tekst live op (stap "PR-tekst
    # ophalen"), dus komt zo'n regel er later bij, dan is "Re-run failed jobs" genoeg.
    #
    # `ready_for_review`: een concept-PR (draft) krijgt alleen de snelle job "Code"; de
    # zware job "Database en end-to-end" draait pas als de PR op klaar wordt gezet. Zo
    # wacht niemand per tussenstap op de browsertest, terwijl mergen zonder die test
    # niet kan: een concept kan niet mergen, en "op klaar zetten" start de hele poort.
    types: [opened, synchronize, reopened, ready_for_review]
  # Geen run meer na een merge op `main`: de ruleset eist dat de branch bij is met main,
  # dus de PR-run heeft precies deze code al getest. Een tweede run kostte bij Richplant
  # een kwart van de Actions-minuten (oktober 2026). Uitrollen heeft zijn eigen workflow.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Snelle controles: geen database nodig, klaar in ongeveer een minuut.
  #
  # Deze job bouwt ook de preview: met de testbalk, zonder sleutels. Is alles groen, dan
  # bewaart hij de gebouwde schermen en servercode als artifact `preview-dist`, en zet
  # preview-uitrollen.yml (altijd de versie van main) het online. Zo wordt de app per push één
  # keer gebouwd in plaats van in een losse preview-job nog eens, en komt er alleen een preview
  # van code die door deze controles is gekomen.
  checks:
    name: Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Volledige historie: de guards vergelijken met de basisbranch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # De guards lezen de PR-tekst voor hun expliciete bevestigingsregels. Live opgehaald,
      # niet uit het event: een herstart van deze job ziet zo ook een regel die later is
      # toegevoegd. Lokaal (`pnpm check`) is PR_BODY leeg.
      - name: PR-tekst ophalen
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        run: |
          einde="PR_BODY_EINDE_$(openssl rand -hex 8)"
          {
            echo "PR_BODY<<${einde}"
            gh api "$PR_URL" --jq '.body // ""'
            echo "${einde}"
          } >> "$GITHUB_ENV"

      - name: Typecontrole
        run: pnpm typecheck

      - name: Opmaak en lint
        run: pnpm lint

      - name: Unittests
        run: pnpm test

      # Eén keer bouwen, met de testbalk: dat is de bouwcontrole én de preview.
      - name: Bouwt het echt (testomgeving)
        env:
          VITE_OMGEVING: test
        run: pnpm build

      - name: Guard - geheimen in repo en bundel
        run: pnpm guard:secrets

      - name: Guard - verstopte typefouten
        run: pnpm guard:escapes

      - name: Guard - tests bij gewijzigde code
        run: pnpm guard:tests

      - name: Guard - destructieve migraties
        run: pnpm guard:migrations

      - name: Guard - bestanden van de gedeelde template
        run: pnpm guard:template

      # De afspraken over wrangler.jsonc: servercode in worker/, opslag alleen in D1 en R2,
      # een eigen D1 en R2 voor de previews, één adres achter Access. Staat in deze job, en
      # dus in de verplichte check "Code": een PR die zich er niet aan houdt kan niet mergen.
      - name: Guard - afspraken in wrangler.jsonc
        run: pnpm guard:cloudflare

      # Als laatste, dus alleen als alles hierboven groen is (ook guard:secrets op de bundel).
      # Alleen voor een PR uit deze repo: een fork krijgt geen preview.
      # De schermen (dist/client) en de servercode (dist/<app>/index.js). De config van de
      # pull request gaat niet mee: preview-uitrollen.yml maakt die uit main.
      - name: Gebouwde preview klaarzetten
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p "$RUNNER_TEMP/preview"
          cp -r dist/client "$RUNNER_TEMP/preview/client"
          worker=$(find dist -mindepth 2 -maxdepth 2 -name index.js -not -path 'dist/client/*' | head -1)
          [ -n "$worker" ] || { echo "::error::de gebouwde servercode (dist/<app>/index.js) ontbreekt"; exit 1; }
          mkdir -p "$RUNNER_TEMP/preview/worker"
          cp -r "$(dirname "$worker")"/. "$RUNNER_TEMP/preview/worker/"
          rm -f "$RUNNER_TEMP/preview/worker/wrangler.json"

      - name: Gebouwde preview bewaren
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: ${{ runner.temp }}/preview
          retention-days: 3
          if-no-files-found: error

  # De hele keten in een echte browser: de gebouwde schermen en servercode in de lokale
  # Workers-omgeving, met een lokale D1 waarop alle migraties draaien. Geen sleutels, en
  # niets bij Cloudflare wordt aangeraakt. De naam blijft gelijk aan die op het andere spoor,
  # want hij staat als verplichte check in de ruleset.
  #
  # Niet bij een concept-PR: zie `ready_for_review` bovenaan. De overgeslagen job telt voor
  # GitHub als geslaagd, maar dat is veilig: een concept kan niet mergen, en op klaar zetten
  # start een nieuwe run die dan wel alles doet (de check staat meteen weer op "bezig").
  # En pas als de job Code groen is (`needs: checks`): is Code rood, dan kost deze job geen
  # minuten.
  database:
    name: Database en end-to-end
    needs: checks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # De browser van Playwright bewaren tussen runs (sleutel: de Playwright-versie uit de
      # lockfile). Bij een treffer zijn alleen de systeempakketten nog nodig.
      - name: Playwright-versie bepalen
        id: playwright
        # Uit het pakket zelf, niet via `pnpm exec`: pnpm 11 zet soms "Already up to date" op stdout.
        run: echo "versie=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Browser uit de cache
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versie }}

      - name: Browser installeren
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Systeempakketten voor de browser
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Zet zelf de lokale database klaar (alle migraties, dus ook een kapotte migratie valt
      # hier al op) en draait de gebouwde app.
      - name: End-to-end test
        env:
          WRANGLER_SEND_METRICS: "false"
        run: pnpm test:e2e

      - name: Rapport bewaren als er iets faalde
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-rapport
          path: playwright-report/
          retention-days: 7
