name: Uitrollen

# Productie bij een merge naar main. De preview per pull request staat hier niet meer: die
# bouwt de job Code van de Kwaliteitspoort (ci.yml), zonder sleutels, en preview-uitrollen.yml
# (altijd de versie van main) uploadt dat met de preview-sleutel naar de Worker
# `<app>-preview`, met de opslag uit `env.preview` van main. Zo wordt een PR één keer gebouwd,
# en ziet code uit een PR nooit een sleutel en nooit de echte gegevens.
#   production  CLOUDFLARE_API_TOKEN (uitrollen, D1-migraties), vars CLOUDFLARE_ACCOUNT_ID,
#               ACCESS_TEAM, ACCESS_AUD (de Access-apps van productie), VITE_SENTRY_DSN
#               (schermen en servercode; leeg = geen Sentry)
#   preview     een eigen CLOUDFLARE_API_TOKEN, vars CLOUDFLARE_ACCOUNT_ID, ACCESS_TEAM,
#               ACCESS_AUD (de Access-app van de preview-Worker), VITE_SENTRY_DSN (alleen de
#               servercode van de preview; leeg = geen Sentry); alleen preview-uitrollen.yml
# De omgevingen production en preview zijn beperkt tot main.
#
# Eén uitzondering op "alleen productie": de job Overgang. Een workflow_run-workflow leest GitHub
# altijd van main. In de eerste update-PR naar versie 39 of later staat op main dus nog de oude
# preview-uitrollen.yml, die wacht op een geslaagde run van "Uitrollen" met het artifact
# `preview-dist`. De nieuwe Kwaliteitspoort bouwt dat artifact wel, maar daar luistert de oude
# niet naar, en zonder deze job kreeg die PR geen preview. Daarom draait Uitrollen op een PR die
# preview-uitrollen.yml zelf wijzigt (dat is precies die update-PR), en bouwt Overgang dan het
# artifact zoals de oude job Preview dat deed, maar alleen als main nog de oude versie heeft.
# Na de merge luistert main naar de Kwaliteitspoort en slaat Overgang zichzelf over.
on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/preview-uitrollen.yml]

concurrency:
  group: uitrollen-${{ github.ref }}
  # Een productie-uitrol wordt nooit afgebroken; een nieuwere push op de PR mag de oude afbreken.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  productie:
    name: Productie
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Is alles ingericht?
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        # bash voor de vergelijking met =~ hieronder.
        shell: bash
        run: |
          node scripts/guard-cloudflare.mjs
          # Zonder DSN staat de foutbewaking stil uit (schermen en servercode); dan hoor je een
          # storing pas als iemand belt. Geen reden om niet uit te rollen, wel om het bij elke
          # uitrol hardop te zeggen.
          if [ -z "$VITE_SENTRY_DSN" ]; then
            echo "::warning::Foutbewaking (Sentry) staat uit voor deze app: VITE_SENTRY_DSN ontbreekt in omgeving production."
          elif ! [[ "$VITE_SENTRY_DSN" =~ ^https://[0-9a-f]+@o[0-9]+\.ingest(\.[a-z]+)?\.sentry\.io/[0-9]+$ ]]; then
            echo "::warning::VITE_SENTRY_DSN ziet er niet uit als een DSN van Sentry; controleer de waarde in omgeving production."
          fi
          ingericht=$(node -e "import('./scripts/lib/cloudflare-config.mjs').then((m) => console.log(m.isIngericht()))")
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN ontbreekt in omgeving production. Uitrollen wordt overgeslagen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$ingericht" != "true" ]; then
            echo "::notice::De database-id's in wrangler.jsonc zijn nog de nullen uit de template. De app is nog niet ingericht; uitrollen wordt overgeslagen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$ACCESS_AUD" ]; then
            # Nooit live zonder de controle van Access in de servercode: dan zou alles achter
            # /api dicht blijven, of erger, de deur staat er nog niet.
            echo "::notice::ACCESS_AUD ontbreekt in omgeving production. De deur is nog niet ingericht; uitrollen wordt overgeslagen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6

      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Bouwen
        if: steps.check.outputs.skip != 'true'
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: pnpm build

      # Eerst de testdatabase (canary): faalt een migratie daar, dan blijft productie
      # onaangeroerd. Daarna productie, en pas dan de nieuwe code.
      - name: Migraties op de testdatabase
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          CI: "1"
        run: pnpm exec wrangler d1 migrations apply DB --remote --env preview -c wrangler.jsonc

      - name: Migraties op productie
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          CI: "1"
        run: pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.jsonc

      - name: Uitrollen naar Cloudflare
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM: ${{ vars.ACCESS_TEAM }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          WRANGLER_SEND_METRICS: "false"
        # Dezelfde DSN als de schermen; zonder DSN krijgt de Worker er geen en staat Sentry uit.
        shell: bash
        run: |
          sentry=()
          if [ -n "$SENTRY_DSN" ]; then sentry=(--var "SENTRY_DSN:$SENTRY_DSN"); fi
          pnpm exec wrangler deploy --var "ACCESS_TEAM:$ACCESS_TEAM" --var "ACCESS_AUD:$ACCESS_AUD" "${sentry[@]}"

  overgang:
    name: Preview (overgang)
    # Alleen voor een PR uit deze repo; noemt geen omgeving en leest geen secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wacht main nog op Uitrollen?
        id: oud
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          main=$(gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/.github/workflows/preview-uitrollen.yml?ref=main" 2>/dev/null || true)
          if printf '%s\n' "$main" | grep -Eq '^ +workflows: \[Uitrollen\]'; then
            echo "bouwen=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main heeft de nieuwe Preview uitrollen al; de preview komt van de Kwaliteitspoort. Hier hoeft niets te gebeuren."
          fi

      - if: steps.oud.outputs.bouwen == 'true'
        uses: actions/checkout@v7

      - name: Wrangler-config controleren
        if: steps.oud.outputs.bouwen == 'true'
        run: node scripts/guard-cloudflare.mjs

      - if: steps.oud.outputs.bouwen == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.oud.outputs.bouwen == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.oud.outputs.bouwen == 'true'
        run: pnpm install --frozen-lockfile

      - name: Bouwen (testomgeving)
        if: steps.oud.outputs.bouwen == 'true'
        env:
          VITE_OMGEVING: test
        run: pnpm build

      - name: Guard - geheimen in repo en bundel
        if: steps.oud.outputs.bouwen == 'true'
        run: pnpm guard:secrets

      # Zoals de oude job Preview: de schermen (dist/client) en de servercode, zonder de config.
      - name: Gebouwde preview klaarzetten
        if: steps.oud.outputs.bouwen == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/preview"
          cp -r dist/client "$RUNNER_TEMP/preview/client"
          worker=$(find dist -mindepth 2 -maxdepth 2 -name index.js -not -path 'dist/client/*' | head -1)
          [ -n "$worker" ] || { echo "::error::de gebouwde servercode (dist/<app>/index.js) ontbreekt"; exit 1; }
          mkdir -p "$RUNNER_TEMP/preview/worker"
          cp -r "$(dirname "$worker")"/. "$RUNNER_TEMP/preview/worker/"
          rm -f "$RUNNER_TEMP/preview/worker/wrangler.json"

      - name: Gebouwde preview bewaren
        if: steps.oud.outputs.bouwen == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: ${{ runner.temp }}/preview
          retention-days: 3
          if-no-files-found: error
