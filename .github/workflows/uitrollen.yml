name: Uitrollen

# Productie bij een merge naar main. De preview per pull request staat hier niet meer: die
# bouwt de job Code van de Kwaliteitspoort (ci.yml), zonder sleutels, en preview-uitrollen.yml
# (altijd de versie van main) uploadt dat met de preview-sleutel naar de Worker
# `<app>-preview`, met de opslag uit `env.preview` van main. Zo wordt een PR één keer gebouwd,
# en ziet code uit een PR nooit een sleutel en nooit de echte gegevens.
#   production  CLOUDFLARE_API_TOKEN (uitrollen, D1-migraties), vars CLOUDFLARE_ACCOUNT_ID,
#               ACCESS_TEAM, ACCESS_AUD (de Access-apps van productie), VITE_SENTRY_DSN
#               (schermen en servercode; leeg = geen Sentry)
#   preview     een eigen CLOUDFLARE_API_TOKEN, vars CLOUDFLARE_ACCOUNT_ID, ACCESS_TEAM,
#               ACCESS_AUD (de Access-app van de preview-Worker), VITE_SENTRY_DSN (alleen de
#               servercode van de preview; leeg = geen Sentry); alleen preview-uitrollen.yml
# De omgevingen production en preview zijn beperkt tot main.
on:
  push:
    branches: [main]

concurrency:
  group: uitrollen-${{ github.ref }}
  # Een productie-uitrol wordt nooit afgebroken.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  productie:
    name: Productie
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Is alles ingericht?
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: |
          node scripts/guard-cloudflare.mjs
          ingericht=$(node -e "import('./scripts/lib/cloudflare-config.mjs').then((m) => console.log(m.isIngericht()))")
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN ontbreekt in omgeving production. Uitrollen wordt overgeslagen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$ingericht" != "true" ]; then
            echo "::notice::De database-id's in wrangler.jsonc zijn nog de nullen uit de template. De app is nog niet ingericht; uitrollen wordt overgeslagen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$ACCESS_AUD" ]; then
            # Nooit live zonder de controle van Access in de servercode: dan zou alles achter
            # /api dicht blijven, of erger, de deur staat er nog niet.
            echo "::notice::ACCESS_AUD ontbreekt in omgeving production. De deur is nog niet ingericht; uitrollen wordt overgeslagen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6

      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Bouwen
        if: steps.check.outputs.skip != 'true'
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: pnpm build

      # Eerst de testdatabase (canary): faalt een migratie daar, dan blijft productie
      # onaangeroerd. Daarna productie, en pas dan de nieuwe code.
      - name: Migraties op de testdatabase
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          CI: "1"
        run: pnpm exec wrangler d1 migrations apply DB --remote --env preview -c wrangler.jsonc

      - name: Migraties op productie
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          CI: "1"
        run: pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.jsonc

      - name: Uitrollen naar Cloudflare
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM: ${{ vars.ACCESS_TEAM }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          WRANGLER_SEND_METRICS: "false"
        # Dezelfde DSN als de schermen; zonder DSN krijgt de Worker er geen en staat Sentry uit.
        shell: bash
        run: |
          sentry=()
          if [ -n "$SENTRY_DSN" ]; then sentry=(--var "SENTRY_DSN:$SENTRY_DSN"); fi
          pnpm exec wrangler deploy --var "ACCESS_TEAM:$ACCESS_TEAM" --var "ACCESS_AUD:$ACCESS_AUD" "${sentry[@]}"
